<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford Auto Typing English</title>
    <style>
        :root {
            --primary: #002147;
            --accent: #0073e6;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        /* Настройки темы */
        .controls-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .topic-badge {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .progress-bar {
            background-color: #e5e7eb;
            height: 8px;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Карточка слова */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .word-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background-color: #f3f4f6;
        }

        .word-info h2 {
            margin: 0;
            font-size: 2rem;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .pos {
            font-style: italic;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .phonetic {
            color: var(--accent);
            font-weight: bold;
        }

        .definition-block {
            margin-top: 15px;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
        }

        .def-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            font-weight: bold;
        }

        .definition {
            font-size: 1.05rem;
            margin: 5px 0 10px 0;
            line-height: 1.4;
        }

        .example {
            color: #4b5563;
            font-style: italic;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 8px 0;
        }

        /* Поле набора */
        .typing-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .typing-input {
            width: 80%;
            padding: 12px 16px;
            font-size: 1.2rem;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        .typing-input:focus {
            border-color: var(--accent);
        }

        .typing-input.correct {
            border-color: var(--success);
            background-color: #ecfdf5;
        }

        .typing-input.wrong {
            border-color: var(--error);
            background-color: #fef2f2;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .loader {
            display: none;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Oxford Auto Practice</h1>
        <div class="topic-badge" id="topicName">Тема не выбрана</div>
    </header>

    <div class="controls-card">
        <div class="input-group">
            <input type="text" id="customTopicInput" placeholder="Введите тему (например: nature, science, technology)">
            <button class="btn-action" id="generateBtn" onclick="fetchRandomWords()">Загрузить слова</button>
        </div>
        <div class="loader" id="loader">⏳ Поиск слов в словаре...</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Карточка слова -->
    <div class="card">
        <div class="card-header">
            <img id="wordImg" class="word-image" src="" alt="Word Visual">
            <div class="word-info">
                <h2 id="wordTarget">______</h2>
                <div>
                    <span class="pos" id="wordPos">pos</span> 
                    <span class="phonetic" id="wordPhonetic">/ /</span>
                </div>
            </div>
        </div>

        <div class="definition-block">
            <div class="def-label">Oxford Definition</div>
            <div class="definition" id="wordDef">Нажмите «Загрузить слова», чтобы начать...</div>
            <div class="example" id="wordExample">"Пример появится здесь."</div>
        </div>
    </div>

    <!-- Поле набора -->
    <div class="typing-box">
        <input type="text" id="typingInput" class="typing-input" placeholder="Введите слово..." autocomplete="off" disabled>
        <div class="hint">Напечатайте слово правильно и нажмите Enter</div>
    </div>
</div>

<script>
    let wordsList = [];
    let currentIndex = 0;

    const defaultTopics = ['technology', 'nature', 'science', 'travel', 'food', 'music', 'sport', 'art', 'business'];

    async function fetchRandomWords() {
        let topic = document.getElementById('customTopicInput').value.trim();
        if (!topic) {
            topic = defaultTopics[Math.floor(Math.random() * defaultTopics.length)];
            document.getElementById('customTopicInput').value = topic;
        }

        const loader = document.getElementById('loader');
        const generateBtn = document.getElementById('generateBtn');
        loader.style.display = 'block';
        generateBtn.disabled = true;

        try {
            // 1. Получаем списки слов по теме через Datamuse API
            const response = await fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(topic)}&max=30`);
            const rawWords = await response.json();

            // Перемешиваем слова
            const shuffledWords = rawWords.map(w => w.word).sort(() => 0.5 - Math.random());

            wordsList = [];

            // 2. Достаем определения из Free Dictionary API
            for (let word of shuffledWords) {
                if (wordsList.length >= 10) break; // Загружаем первые 10 валидных слов для быстрого старта

                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                    if (!dictRes.ok) continue;

                    const dictData = await dictRes.ok ? await dictRes.json() : null;
                    if (!dictData || !dictData[0]) continue;

                    const entry = dictData[0];
                    const meaning = entry.meanings[0];
                    const defObj = meaning ? meaning.definitions[0] : null;

                    if (defObj && defObj.definition) {
                        wordsList.push({
                            word: word.toLowerCase(),
                            pos: meaning.partOfSpeech || 'noun',
                            phonetic: entry.phonetic || (entry.phonetics[0] ? entry.phonetics[0].text : '/.../'),
                            def: defObj.definition,
                            example: defObj.example || `The term "${word}" is commonly used in English.`
                        });
                    }
                } catch (e) {
                    // Пропускаем слова, на которые нет словаря
                }
            }

            if (wordsList.length === 0) {
                alert('Не удалось найти подходящие слова для этой темы. Попробуйте другую!');
                return;
            }

            currentIndex = 0;
            document.getElementById('typingInput').disabled = false;
            loadWord();

        } catch (err) {
            console.error(err);
            alert('Ошибка при загрузке данных. Проверьте интернет-соединение.');
        } finally {
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    }

    function loadWord() {
        if (!wordsList || wordsList.length === 0) return;

        const item = wordsList[currentIndex];
        const topic = document.getElementById('customTopicInput').value || 'Random';
        
        document.getElementById('topicName').textContent = `Тема: ${topic} (${currentIndex + 1}/${wordsList.length})`;
        document.getElementById('wordTarget').textContent = item.word.replace(/./g, '•'); 
        document.getElementById('wordPos').textContent = item.pos;
        document.getElementById('wordPhonetic').textContent = item.phonetic;
        document.getElementById('wordDef').textContent = item.def;
        document.getElementById('wordExample').textContent = `"${item.example}"`;
        
        // Визуализация слова
        document.getElementById('wordImg').src = `https://loremflickr.com/300/300/${encodeURIComponent(item.word)}`;

        const typingInput = document.getElementById('typingInput');
        typingInput.value = '';
        typingInput.className = 'typing-input';
        typingInput.focus();

        const progress = ((currentIndex) / wordsList.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
    }

    const typingInput = document.getElementById('typingInput');

    typingInput.addEventListener('input', () => {
        if (wordsList.length === 0) return;
        const target = wordsList[currentIndex].word.toLowerCase();
        const inputVal = typingInput.value.trim().toLowerCase();

        if (inputVal === target) {
            typingInput.className = 'typing-input correct';
            document.getElementById('wordTarget').textContent = target;
        } else if (target.startsWith(inputVal)) {
            typingInput.className = 'typing-input';
        } else {
            typingInput.className = 'typing-input wrong';
        }
    });

    typingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const target = wordsList[currentIndex].word.toLowerCase();
            if (typingInput.value.trim().toLowerCase() === target) {
                nextWord();
            }
        }
    });

    function nextWord() {
        if (currentIndex < wordsList.length - 1) {
            currentIndex++;
            loadWord();
        } else {
            alert('🎉 Отлично! Вы полностью прошлись по этой подборке слов!');
        }
    }
</script>

</body>
</html>
