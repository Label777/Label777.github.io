<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Typing & Vocabulary Practice</title>
    <style>
        :root {
            --primary: #002147;
            --accent: #0073e6;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --text: #1f2937;
            --success: #10b981;
            --error: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        /* Настройки темы и уровня */
        .controls-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 2;
            min-width: 180px;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .input-group select {
            flex: 1;
            min-width: 140px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-weight: bold;
            background: white;
            cursor: pointer;
        }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-action:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .topic-badge {
            display: inline-block;
            background-color: var(--primary);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .progress-bar {
            background-color: #e5e7eb;
            height: 8px;
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            background-color: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Карточка слова */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 25px;
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .word-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background-color: #f3f4f6;
        }

        .word-info h2 {
            margin: 0;
            font-size: 2rem;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .pos {
            font-style: italic;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .phonetic {
            color: var(--accent);
            font-weight: bold;
        }

        .definition-block {
            margin-top: 15px;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
        }

        .def-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
            font-weight: bold;
        }

        .definition {
            font-size: 1.05rem;
            margin: 5px 0 10px 0;
            line-height: 1.4;
        }

        .example {
            color: #4b5563;
            font-style: italic;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 8px 0;
        }

        /* Поле набора */
        .typing-box {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .typing-input {
            width: 80%;
            padding: 12px 16px;
            font-size: 1.2rem;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }

        .typing-input:focus {
            border-color: var(--accent);
        }

        .typing-input.correct {
            border-color: var(--success);
            background-color: #ecfdf5;
        }

        .typing-input.wrong {
            border-color: var(--error);
            background-color: #fef2f2;
        }

        .hint {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .loader {
            display: none;
            text-align: center;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>English Typing Practice</h1>
        <div class="topic-badge" id="topicName">Тема не выбрана</div>
    </header>

    <div class="controls-card">
        <div class="input-group">
            <input type="text" id="customTopicInput" placeholder="Введите тему (напр. nature, food, work)">
            
            <select id="levelSelect">
                <option value="A1">Уровень A1 (Beginner)</option>
                <option value="A2">Уровень A2 (Elementary)</option>
                <option value="B1" selected>Уровень B1 (Intermediate)</option>
                <option value="B2">Уровень B2 (Upper-Intermediate)</option>
                <option value="C1">Уровень C1 (Advanced)</option>
                <option value="C2">Уровень C2 (Proficiency)</option>
            </select>

            <button class="btn-action" id="generateBtn" onclick="fetchRandomWords()">Загрузить слова</button>
        </div>
        <div class="loader" id="loader">⏳ Поиск и фильтрация слов по уровню...</div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <!-- Карточка слова -->
    <div class="card">
        <div class="card-header">
            <img id="wordImg" class="word-image" src="" alt="Word Visual">
            <div class="word-info">
                <h2 id="wordTarget">______</h2>
                <div>
                    <span class="pos" id="wordPos">pos</span> 
                    <span class="phonetic" id="wordPhonetic">/ /</span>
                </div>
            </div>
        </div>

        <div class="definition-block">
            <div class="def-label">Definition</div>
            <div class="definition" id="wordDef">Нажмите «Загрузить слова», чтобы начать...</div>
            <div class="example" id="wordExample">"Пример появится здесь."</div>
        </div>
    </div>

    <!-- Поле набора -->
    <div class="typing-box">
        <input type="text" id="typingInput" class="typing-input" placeholder="Введите слово..." autocomplete="off" disabled>
        <div class="hint">Напечатайте слово правильно и нажмите Enter</div>
    </div>
</div>

<script>
    let wordsList = [];
    let currentIndex = 0;

    const defaultTopics = ['family', 'food', 'nature', 'work', 'travel', 'technology', 'art', 'science', 'society'];

    // Настройки фильтрации сложности слов под уровни CEFR
    const levelSettings = {
        'A1': { minLen: 3, maxLen: 5, minFreq: 5.0 },
        'A2': { minLen: 4, maxLen: 7, minFreq: 4.2 },
        'B1': { minLen: 5, maxLen: 9, minFreq: 3.5 },
        'B2': { minLen: 6, maxLen: 11, minFreq: 2.8 },
        'C1': { minLen: 7, maxLen: 14, minFreq: 1.8 },
        'C2': { minLen: 8, maxLen: 18, minFreq: 0.1 }
    };

    // Получение картинки прямо из поиска Google / Wikimedia
    async function getGoogleImageUrl(query) {
        try {
            const searchUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=400&format=json&origin=*`;
            const res = await fetch(searchUrl);
            const data = await res.json();
            
            if (data.query && data.query.pages) {
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];
                if (pages[pageId].thumbnail && pages[pageId].thumbnail.source) {
                    return pages[pageId].thumbnail.source;
                }
            }
        } catch (e) {
            console.log("Ошибка загрузки изображения:", e);
        }
        return `https://images.unsplash.com/photo-1546410531-bb4caa6b424d?w=300&auto=format&fit=crop`;
    }

    async function fetchRandomWords() {
        let topic = document.getElementById('customTopicInput').value.trim();
        const selectedLevel = document.getElementById('levelSelect').value;
        const config = levelSettings[selectedLevel];

        if (!topic) {
            topic = defaultTopics[Math.floor(Math.random() * defaultTopics.length)];
            document.getElementById('customTopicInput').value = topic;
        }

        const loader = document.getElementById('loader');
        const generateBtn = document.getElementById('generateBtn');
        loader.style.display = 'block';
        generateBtn.disabled = true;

        try {
            const response = await fetch(`https://api.datamuse.com/words?ml=${encodeURIComponent(topic)}&md=f&max=100`);
            const rawWords = await response.json();

            // Фильтруем слова по выбранному уровню
            const filteredWords = rawWords.filter(item => {
                const word = item.word;
                if (word.includes(' ') || word.includes('-')) return false;

                let frequency = 0;
                if (item.tags) {
                    const fTag = item.tags.find(t => t.startsWith('f:'));
                    if (fTag) frequency = parseFloat(fTag.split(':')[1]);
                }

                const len = word.length;
                
                if (selectedLevel === 'A1' || selectedLevel === 'A2') {
                    return len >= config.minLen && len <= config.maxLen && frequency >= config.minFreq;
                } else if (selectedLevel === 'C1' || selectedLevel === 'C2') {
                    return len >= config.minLen && frequency <= config.minFreq;
                } else {
                    return len >= config.minLen && len <= config.maxLen;
                }
            });

            const shuffledWords = filteredWords.map(w => w.word).sort(() => 0.5 - Math.random());

            wordsList = [];

            for (let word of shuffledWords) {
                if (wordsList.length >= 10) break; 

                try {
                    const dictRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
                    if (!dictRes.ok) continue;

                    const dictData = await dictRes.json();
                    if (!dictData || !dictData[0]) continue;

                    const entry = dictData[0];
                    const meaning = entry.meanings[0];
                    const defObj = meaning ? meaning.definitions[0] : null;

                    if (defObj && defObj.definition) {
                        wordsList.push({
                            word: word.toLowerCase(),
                            level: selectedLevel,
                            pos: meaning.partOfSpeech || 'noun',
                            phonetic: entry.phonetic || (entry.phonetics && entry.phonetics[0] ? entry.phonetics[0].text : '/.../'),
                            def: defObj.definition,
                            example: defObj.example || `Example using "${word}".`
                        });
                    }
                } catch (e) {
                    // Пропускаем слова без словаря
                }
            }

            if (wordsList.length === 0) {
                alert(`Не удалось найти слова уровня ${selectedLevel} по этой теме. Попробуйте сменить тему!`);
                return;
            }

            currentIndex = 0;
            document.getElementById('typingInput').disabled = false;
            await loadWord();

        } catch (err) {
            console.error(err);
            alert('Ошибка при загрузке данных. Проверьте подключение к интернету.');
        } finally {
            loader.style.display = 'none';
            generateBtn.disabled = false;
        }
    }

    async function loadWord() {
        if (!wordsList || wordsList.length === 0) return;

        const item = wordsList[currentIndex];
        const topic = document.getElementById('customTopicInput').value || 'Random';
        
        document.getElementById('topicName').textContent = `Тема: ${topic} | Уровень: ${item.level} (${currentIndex + 1}/${wordsList.length})`;
        document.getElementById('wordTarget').textContent = item.word.replace(/./g, '•'); 
        document.getElementById('wordPos').textContent = `${item.pos} [${item.level}]`;
        document.getElementById('wordPhonetic').textContent = item.phonetic;
        document.getElementById('wordDef').textContent = item.def;
        document.getElementById('wordExample').textContent = `"${item.example}"`;
        
        const imgUrl = await getGoogleImageUrl(item.word);
        document.getElementById('wordImg').src = imgUrl;

        const typingInput = document.getElementById('typingInput');
        typingInput.value = '';
        typingInput.className = 'typing-input';
        typingInput.focus();

        const progress = ((currentIndex) / wordsList.length) * 100;
        document.getElementById('progressFill').style.width = `${progress}%`;
    }

    const typingInput = document.getElementById('typingInput');

    typingInput.addEventListener('input', () => {
        if (wordsList.length === 0) return;
        const target = wordsList[currentIndex].word.toLowerCase();
        const inputVal = typingInput.value.trim().toLowerCase();

        if (inputVal === target) {
            typingInput.className = 'typing-input correct';
            document.getElementById('wordTarget').textContent = target;
        } else if (target.startsWith(inputVal)) {
            typingInput.className = 'typing-input';
        } else {
            typingInput.className = 'typing-input wrong';
        }
    });

    typingInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const target = wordsList[currentIndex].word.toLowerCase();
            if (typingInput.value.trim().toLowerCase() === target) {
                nextWord();
            }
        }
    });

    async function nextWord() {
        if (currentIndex < wordsList.length - 1) {
            currentIndex++;
            await loadWord();
        } else {
            alert('🎉 Отлично! Вы полностью прошлись по этой подборке слов!');
        }
    }
</script>

</body>
</html>
